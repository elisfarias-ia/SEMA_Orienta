<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="SEMA Orienta — Assistente de Serviços Ambientais." />
    <meta name="theme-color" content="#14532d" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314532d'/%3E%3Cpath d='M23 8C12 8 8 14 8 20c0 2 .6 3.6 1.600 4.800C10 17 15 13 21 11 16 14 12.500 18 11 24.500 12.200 25 13.500 25.200 15 25.200 22 25.200 24 17 23 8Z' fill='%23bbf7d0'/%3E%3C/svg%3E"
    />
    <title>SEMA Orienta — Assistente de Serviços Ambientais</title>
  </head>
  <body>
    <a class="skip-link" href="#campo-mensagem">Ir para o campo de mensagem</a>

    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="av-assistente" viewBox="0 0 32 32"><circle cx="13" cy="13" r="9" fill="none" stroke="currentColor" stroke-width="2" /><path d="m18 7-3 7-7 3 3-7z" fill="#c6f58e" /><path d="m18 7-3 7-4-4z" fill="currentColor" /><circle cx="13" cy="13" r="1.4" fill="#f0b323" /><path d="M11 23c4-7 10-10 18-8-.5 8-5 13-13 13-4 0-6-2-5-5Z" fill="#78d840" /><path d="M14 25c4-4 8-6 13-8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" /></symbol>
      <symbol id="av-pessoa" viewBox="0 0 32 32"><circle cx="16" cy="11" r="5" fill="currentColor" /><path d="M7 27c.8-6.1 4.2-9 9-9s8.2 2.9 9 9" fill="currentColor" /></symbol>
      <symbol id="i-enviar" viewBox="0 0 24 24"><path d="m3 4 18 8-18 8 4-8-4-8Z" /><path d="M7 12h14" /></symbol>
      <symbol id="i-reiniciar" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6" /><path d="M4 4v6h6" /></symbol>
    </svg>
    <img id="avatar-assistente-modelo" src="/src/assets/sema-orienta-avatar.png" alt="" width="44" height="42" hidden />

    <header class="site-header">
      <div class="site-header__inner">
        <h1 class="site-header__marca">
          <img
            src="/src/assets/sema-orienta-marca.png"
            width="318"
            height="62"
            alt="SEMA Orienta — assistente virtual de serviços ambientais"
          />
        </h1>
        <span class="badge">Sistema em desenvolvimento</span>
      </div>
    </header>

    <main class="chat" aria-label="Conversa com o assistente">
      <div id="faixa-teste" class="faixa-teste" role="status" hidden></div>

      <div
        id="mensagens"
        class="messages"
        role="log"
        aria-live="polite"
        aria-relevant="additions"
        aria-label="Mensagens da conversa"
        tabindex="0"
      ></div>

      <form id="formulario" class="composer" autocomplete="off">
        <label for="campo-mensagem" class="composer__label">Escreva sua dúvida</label>
        <div class="composer__row">
          <button type="button" id="botao-reiniciar" class="btn btn--secondary btn--reiniciar" aria-label="Reiniciar conversa">
            <svg class="icone" aria-hidden="true" focusable="false"><use href="#i-reiniciar" /></svg>
            <span class="btn__texto">Reiniciar conversa</span>
          </button>
          <textarea
            id="campo-mensagem"
            name="mensagem"
            rows="2"
            maxlength="1000"
            placeholder="Digite sua pergunta com suas próprias palavras"
            aria-describedby="dica-teclado"
          ></textarea>
          <button type="submit" class="btn btn--primary btn--enviar" aria-label="Enviar mensagem">
            <svg class="icone" aria-hidden="true" focusable="false"><use href="#i-enviar" /></svg>
          </button>
        </div>
        <p id="dica-teclado" class="composer__hint">Enter envia · Shift + Enter muda de linha</p>
      </form>
    </main>

    <footer class="site-footer">
      <p>Este assistente não substitui a análise da SEMA nem o atendimento oficial. Nenhuma conversa é armazenada.</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
